<!DOCTYPE html>
<html>
<head>
    <title>Price Level Fix Verification</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #1a1a1a; color: white; }
        .container { max-width: 1000px; margin: 0 auto; }
        .result { background: #2a2a2a; padding: 15px; margin: 10px 0; border-radius: 8px; }
        .success { background: #1a4a1a; border: 1px solid #44ff44; }
        .warning { background: #4a4a1a; border: 1px solid #ffff44; }
        .error { background: #4a1a1a; border: 1px solid #ff4444; }
        pre { white-space: pre-wrap; word-wrap: break-word; font-size: 12px; }
        button { background: #4a90e2; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin: 5px; }
        button:hover { background: #357abd; }
        .venue-test { background: #333; padding: 10px; margin: 5px 0; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; }
        .price-display { font-weight: bold; padding: 5px 10px; border-radius: 5px; }
        .test-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>✅ Price Level Fix Verification</h1>
        <p>Testing the improved price level system with intelligent fallbacks</p>
        
        <button onclick="testImprovedPriceSystem()">Test Improved Price System</button>
        <button onclick="testRealVenues()">Test Real Venues</button>
        <button onclick="clearResults()">Clear Results</button>
        
        <div id="results"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8001/api';
        
        function addResult(title, content, type = 'success') {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = `result ${type}`;
            div.innerHTML = `<h3>${title}</h3><div>${content}</div>`;
            results.appendChild(div);
        }
        
        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }
        
        // Updated price functions with intelligent fallbacks
        const getPriceText = (priceLevel, venueType) => {
            const priceMap = {
                0: 'Free',
                1: '$10-20 per person',
                2: '$20-40 per person', 
                3: '$40-80 per person',
                4: '$80+ per person',
                'PRICE_LEVEL_FREE': 'Free',
                'PRICE_LEVEL_INEXPENSIVE': '$10-20 per person',
                'PRICE_LEVEL_MODERATE': '$20-40 per person',
                'PRICE_LEVEL_EXPENSIVE': '$40-80 per person',
                'PRICE_LEVEL_VERY_EXPENSIVE': '$80+ per person'
            };
            
            // If we have a valid price level, use it
            if (priceLevel !== null && priceLevel !== undefined && priceLevel !== '') {
                return priceMap[priceLevel] || 'Price varies';
            }
            
            // Provide intelligent fallbacks based on venue type
            const typeBasedEstimates = {
                'bar': '$15-30 per person',
                'nightclub': '$20-50 per person',
                'restaurant': '$20-40 per person',
                'cafe': '$10-20 per person',
                'fast_food': '$8-15 per person',
                'brewery': '$15-35 per person',
                'wine_bar': '$25-45 per person',
                'cocktail_bar': '$20-40 per person',
                'sports_bar': '$15-30 per person'
            };
            
            return typeBasedEstimates[venueType] || '$15-35 per person';
        };

        const getPriceColor = (priceLevel, venueType) => {
            const colorMap = {
                0: '#4ade80', 1: '#4ade80', 2: '#facc15', 3: '#fb923c', 4: '#f87171',
                'PRICE_LEVEL_FREE': '#4ade80',
                'PRICE_LEVEL_INEXPENSIVE': '#4ade80',
                'PRICE_LEVEL_MODERATE': '#facc15',
                'PRICE_LEVEL_EXPENSIVE': '#fb923c',
                'PRICE_LEVEL_VERY_EXPENSIVE': '#f87171'
            };
            
            // If we have a valid price level, use it
            if (priceLevel !== null && priceLevel !== undefined && priceLevel !== '') {
                return colorMap[priceLevel] || '#facc15';
            }
            
            // Default color for estimated prices
            return '#facc15';
        };
        
        function testImprovedPriceSystem() {
            const testCases = [
                // Valid price levels
                { priceLevel: 'PRICE_LEVEL_MODERATE', venueType: 'bar', expected: '$20-40 per person' },
                { priceLevel: 'PRICE_LEVEL_INEXPENSIVE', venueType: 'cafe', expected: '$10-20 per person' },
                { priceLevel: 2, venueType: 'restaurant', expected: '$20-40 per person' },
                
                // Missing price levels (should use fallbacks)
                { priceLevel: null, venueType: 'bar', expected: '$15-30 per person' },
                { priceLevel: undefined, venueType: 'nightclub', expected: '$20-50 per person' },
                { priceLevel: '', venueType: 'restaurant', expected: '$20-40 per person' },
                { priceLevel: null, venueType: 'unknown_type', expected: '$15-35 per person' },
                
                // Edge cases
                { priceLevel: 'invalid', venueType: 'bar', expected: 'Price varies' },
                { priceLevel: 999, venueType: 'cafe', expected: 'Price varies' }
            ];
            
            let content = '<div class="test-grid">';
            let passedTests = 0;
            
            testCases.forEach((test, i) => {
                const result = getPriceText(test.priceLevel, test.venueType);
                const color = getPriceColor(test.priceLevel, test.venueType);
                const passed = result === test.expected;
                
                if (passed) passedTests++;
                
                content += `<div class="venue-test" style="border: 2px solid ${passed ? '#44ff44' : '#ff4444'}">`;
                content += `<div>`;
                content += `<strong>Test ${i + 1}:</strong> ${test.venueType}<br>`;
                content += `Price Level: "${test.priceLevel}"<br>`;
                content += `Expected: ${test.expected}<br>`;
                content += `</div>`;
                content += `<div class="price-display" style="background: #333; color: ${color}">`;
                content += `${result} ${passed ? '✅' : '❌'}`;
                content += `</div>`;
                content += `</div>`;
            });
            
            content += '</div>';
            content += `<br><strong>Results: ${passedTests}/${testCases.length} tests passed</strong>`;
            
            addResult('🧪 Improved Price System Test', content, passedTests === testCases.length ? 'success' : 'error');
        }
        
        async function testRealVenues() {
            try {
                const response = await fetch(`${API_BASE}/venues?limit=10`);
                const data = await response.json();
                
                if (data.data && data.data.length > 0) {
                    let content = '<div class="test-grid">';
                    let noMorePriceVaries = 0;
                    
                    data.data.forEach(venue => {
                        const priceText = getPriceText(venue.price_level, venue.type);
                        const priceColor = getPriceColor(venue.price_level, venue.type);
                        const isImproved = priceText !== 'Price varies';
                        
                        if (isImproved) noMorePriceVaries++;
                        
                        content += `<div class="venue-test">`;
                        content += `<div>`;
                        content += `<strong>${venue.name}</strong><br>`;
                        content += `Type: ${venue.type}<br>`;
                        content += `Raw price_level: "${venue.price_level}"<br>`;
                        content += `</div>`;
                        content += `<div class="price-display" style="background: #333; color: ${priceColor}">`;
                        content += `${priceText} ${isImproved ? '✅' : '❌'}`;
                        content += `</div>`;
                        content += `</div>`;
                    });
                    
                    content += '</div>';
                    content += `<br><strong>Results: ${noMorePriceVaries}/${data.data.length} venues now show meaningful prices</strong>`;
                    
                    if (noMorePriceVaries === data.data.length) {
                        content += `<br><br>🎉 <strong>SUCCESS!</strong> No more "Price varies" - all venues show useful price information!`;
                    }
                    
                    addResult('🏢 Real Venues Test', content, noMorePriceVaries === data.data.length ? 'success' : 'warning');
                } else {
                    addResult('❌ Real Venues Test', 'No venues returned from API', 'error');
                }
            } catch (error) {
                addResult('❌ Real Venues Test Error', error.message, 'error');
            }
        }
        
        // Auto-run tests
        window.onload = function() {
            setTimeout(() => {
                testImprovedPriceSystem();
                setTimeout(testRealVenues, 1000);
            }, 500);
        };
    </script>
</body>
</html>
