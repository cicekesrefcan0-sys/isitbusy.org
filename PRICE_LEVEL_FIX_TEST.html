<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💰 Price Level Fix Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0a0a0f;
            color: white;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .success {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid #22c55e;
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
        }
        .error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid #ef4444;
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
        }
        .venue-card {
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            padding: 16px;
            margin: 10px 0;
            cursor: pointer;
            transition: all 0.3s;
        }
        .venue-card:hover {
            background: rgba(255,255,255,0.1);
            transform: translateY(-2px);
        }
        .venue-name {
            font-size: 18px;
            font-weight: bold;
            color: #60a5fa;
            margin-bottom: 8px;
        }
        .venue-address {
            color: #9ca3af;
            margin-bottom: 8px;
        }
        .venue-meta {
            font-size: 12px;
            color: #6b7280;
        }
        .price-display {
            font-size: 16px;
            font-weight: bold;
            padding: 8px 12px;
            border-radius: 6px;
            margin: 8px 0;
            display: inline-block;
        }
        .price-green { background: rgba(34, 197, 94, 0.2); color: #22c55e; }
        .price-yellow { background: rgba(234, 179, 8, 0.2); color: #eab308; }
        .price-orange { background: rgba(249, 115, 22, 0.2); color: #f97316; }
        .price-red { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
        .price-gray { background: rgba(156, 163, 175, 0.2); color: #9ca3af; }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px 5px;
            font-weight: bold;
        }
        button:hover { background: #2563eb; }
    </style>
</head>
<body>
    <div class="container">
        <h1>💰 Price Level Fix Test</h1>
        <p>Testing if the price level display now shows "$20-40 per person" instead of "Price varies".</p>
        
        <button onclick="testPriceLevels()">🧪 Test Price Level Display</button>
        <button onclick="openFrontend()">🌐 Open Frontend</button>
        
        <div id="results"></div>
    </div>

    <script>
        // Price level mapping functions (same as frontend)
        function getPriceText(priceLevel) {
            const priceMap = {
                // Numeric format
                0: 'Free',
                1: '$10-20 per person',
                2: '$20-40 per person', 
                3: '$40-80 per person',
                4: '$80+ per person',
                // Google Places API string format
                'PRICE_LEVEL_FREE': 'Free',
                'PRICE_LEVEL_INEXPENSIVE': '$10-20 per person',
                'PRICE_LEVEL_MODERATE': '$20-40 per person',
                'PRICE_LEVEL_EXPENSIVE': '$40-80 per person',
                'PRICE_LEVEL_VERY_EXPENSIVE': '$80+ per person'
            };
            return priceMap[priceLevel] || 'Price varies';
        }

        function getPriceColor(priceLevel) {
            const colorMap = {
                // Numeric format
                0: 'price-green',
                1: 'price-green',
                2: 'price-yellow',
                3: 'price-orange',
                4: 'price-red',
                // Google Places API string format
                'PRICE_LEVEL_FREE': 'price-green',
                'PRICE_LEVEL_INEXPENSIVE': 'price-green',
                'PRICE_LEVEL_MODERATE': 'price-yellow',
                'PRICE_LEVEL_EXPENSIVE': 'price-orange',
                'PRICE_LEVEL_VERY_EXPENSIVE': 'price-red'
            };
            return colorMap[priceLevel] || 'price-gray';
        }

        async function testPriceLevels() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<h2>🧪 Testing Price Level Display...</h2>';
            
            try {
                const response = await fetch('http://localhost:8001/api/venues?limit=10');
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                const venues = data.data || [];
                
                if (venues.length > 0) {
                    let fixedCount = 0;
                    let totalWithPriceLevel = 0;
                    
                    let html = `
                        <div class="success">
                            <h2>✅ Price Level Test Results</h2>
                            <p>Testing ${venues.length} venues for proper price level display:</p>
                    `;
                    
                    venues.forEach(venue => {
                        if (venue.price_level) {
                            totalWithPriceLevel++;
                            const priceText = getPriceText(venue.price_level);
                            const priceColor = getPriceColor(venue.price_level);
                            
                            if (priceText !== 'Price varies') {
                                fixedCount++;
                            }
                            
                            html += `
                                <div class="venue-card">
                                    <div class="venue-name">${venue.name}</div>
                                    <div class="venue-address">📍 ${venue.address}</div>
                                    <div class="venue-meta">
                                        Raw price_level: "${venue.price_level}"<br>
                                        <span class="price-display ${priceColor}">${priceText}</span>
                                    </div>
                                </div>
                            `;
                        }
                    });
                    
                    html += `
                            <div style="margin-top: 20px; padding: 16px; background: rgba(59, 130, 246, 0.1); border-radius: 8px;">
                                <h3>📊 Summary:</h3>
                                <p><strong>Venues with price_level:</strong> ${totalWithPriceLevel}</p>
                                <p><strong>Properly formatted:</strong> ${fixedCount}</p>
                                <p><strong>Still showing "Price varies":</strong> ${totalWithPriceLevel - fixedCount}</p>
                                <p><strong>Success rate:</strong> ${totalWithPriceLevel > 0 ? Math.round(fixedCount/totalWithPriceLevel*100) : 0}%</p>
                            </div>
                        </div>
                    `;
                    
                    if (fixedCount === totalWithPriceLevel && totalWithPriceLevel > 0) {
                        html += `
                            <div class="success">
                                <h2>🎉 Price Level Fix Successful!</h2>
                                <p>All venues now show proper price level format like "$20-40 per person"</p>
                                <p>The frontend should now display prices correctly in both venue cards and detail pages.</p>
                            </div>
                        `;
                    } else if (fixedCount > 0) {
                        html += `
                            <div style="background: rgba(234, 179, 8, 0.1); border: 1px solid #eab308; border-radius: 12px; padding: 20px;">
                                <h2>⚠️ Partial Fix</h2>
                                <p>Some venues are fixed, but ${totalWithPriceLevel - fixedCount} still show "Price varies"</p>
                                <p>This might be due to venues with null or undefined price_level values.</p>
                            </div>
                        `;
                    } else {
                        html += `
                            <div class="error">
                                <h2>❌ Fix Not Working</h2>
                                <p>Price levels are still not displaying correctly. Frontend may need to be restarted.</p>
                            </div>
                        `;
                    }
                    
                    resultsDiv.innerHTML = html;
                } else {
                    resultsDiv.innerHTML = `
                        <div class="error">
                            <h2>❌ No Venues Found</h2>
                            <p>API returned no venues to test.</p>
                        </div>
                    `;
                }
            } catch (error) {
                resultsDiv.innerHTML = `
                    <div class="error">
                        <h2>❌ Test Failed</h2>
                        <p><strong>Error:</strong> ${error.message}</p>
                        <p>Make sure both backend and frontend are running.</p>
                    </div>
                `;
            }
        }

        function openFrontend() {
            window.open('http://localhost:3001', '_blank');
        }

        // Auto-run test on page load
        window.addEventListener('load', () => {
            testPriceLevels();
        });
    </script>
</body>
</html>
