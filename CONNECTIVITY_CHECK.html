<!DOCTYPE html>
<html>
<head>
    <title>Connectivity Check</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #1a1a1a; color: white; }
        .container { max-width: 800px; margin: 0 auto; }
        .result { background: #2a2a2a; padding: 15px; margin: 10px 0; border-radius: 8px; }
        .success { background: #1a4a1a; border: 1px solid #44ff44; }
        .error { background: #4a1a1a; border: 1px solid #ff4444; }
        button { background: #4a90e2; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin: 5px; }
        button:hover { background: #357abd; }
        pre { white-space: pre-wrap; word-wrap: break-word; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Connectivity Check</h1>
        <p>Testing backend API connectivity</p>
        
        <button onclick="testConnectivity()">Test Backend Connection</button>
        <button onclick="testVenueAPI()">Test Venue API</button>
        <button onclick="clearResults()">Clear Results</button>
        
        <div id="results"></div>
    </div>

    <script>
        function addResult(title, content, type = 'success') {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = `result ${type}`;
            div.innerHTML = `<h3>${title}</h3><div>${content}</div>`;
            results.appendChild(div);
        }
        
        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }
        
        async function testConnectivity() {
            const endpoints = [
                'http://localhost:8001/api/venues?limit=1',
                'http://localhost:8001/health',
                'http://localhost:8001/',
                'http://127.0.0.1:8001/api/venues?limit=1'
            ];
            
            for (const endpoint of endpoints) {
                try {
                    console.log(`Testing: ${endpoint}`);
                    const response = await fetch(endpoint, {
                        method: 'GET',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        mode: 'cors'
                    });
                    
                    if (response.ok) {
                        const data = await response.json();
                        addResult(`✅ ${endpoint}`, `Status: ${response.status}\nResponse: ${JSON.stringify(data, null, 2)}`, 'success');
                    } else {
                        addResult(`❌ ${endpoint}`, `Status: ${response.status}\nError: ${response.statusText}`, 'error');
                    }
                } catch (error) {
                    addResult(`❌ ${endpoint}`, `Error: ${error.message}`, 'error');
                }
            }
        }
        
        async function testVenueAPI() {
            try {
                const response = await fetch('http://localhost:8001/api/venues?limit=5');
                
                if (response.ok) {
                    const data = await response.json();
                    
                    let content = `<strong>API Response:</strong><br>`;
                    content += `Status: ${response.status}<br>`;
                    content += `Total venues: ${data.data ? data.data.length : 'N/A'}<br><br>`;
                    
                    if (data.data && data.data.length > 0) {
                        const venue = data.data[0];
                        content += `<strong>Sample venue:</strong><br>`;
                        content += `Name: ${venue.name}<br>`;
                        content += `Type: ${venue.type}<br>`;
                        content += `Price Level: "${venue.price_level}"<br>`;
                        content += `ID: ${venue.id}<br><br>`;
                        
                        content += `<strong>Full venue object:</strong><br>`;
                        content += `<pre>${JSON.stringify(venue, null, 2)}</pre>`;
                    }
                    
                    addResult('✅ Venue API Test', content, 'success');
                } else {
                    addResult('❌ Venue API Test', `HTTP ${response.status}: ${response.statusText}`, 'error');
                }
            } catch (error) {
                addResult('❌ Venue API Test', `Error: ${error.message}`, 'error');
            }
        }
        
        // Auto-run tests
        window.onload = function() {
            setTimeout(testConnectivity, 500);
        };
    </script>
</body>
</html>
