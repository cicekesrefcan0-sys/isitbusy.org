<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venue Website Demo - Is It Busy</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        .header h1 {
            font-size: 3rem;
            margin: 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
            margin: 10px 0;
        }
        .venues-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .venue-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .venue-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .venue-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }
        .venue-name {
            font-size: 1.4rem;
            font-weight: bold;
            margin: 0;
        }
        .busyness-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .busy { background: #ef4444; }
        .moderate { background: #f59e0b; }
        .not-busy { background: #10b981; }
        .very-busy { background: #dc2626; }
        .extremely-busy { background: #991b1b; }
        .venue-info {
            margin: 15px 0;
        }
        .venue-info p {
            margin: 5px 0;
            opacity: 0.9;
        }
        .venue-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }
        .btn-primary {
            background: #3b82f6;
            color: white;
        }
        .btn-primary:hover {
            background: #2563eb;
            transform: translateY(-2px);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        .btn-success {
            background: #10b981;
            color: white;
        }
        .btn-success:hover {
            background: #059669;
        }
        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2rem;
        }
        .error {
            text-align: center;
            padding: 40px;
            background: rgba(239, 68, 68, 0.2);
            border-radius: 10px;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        .stats {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 30px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        .stat {
            text-align: center;
        }
        .stat-number {
            font-size: 2.5rem;
            font-weight: bold;
            margin: 0;
        }
        .stat-label {
            font-size: 0.9rem;
            opacity: 0.8;
            margin: 5px 0 0 0;
        }
        .website-status {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 0.8rem;
            margin-top: 5px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        .status-working { background: #10b981; }
        .status-error { background: #ef4444; }
        .status-unknown { background: #6b7280; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏢 Venue Website Demo</h1>
            <p>Colorado Mekanları ve Gerçek Websiteleri</p>
            <p><strong>Backend:</strong> http://localhost:8002 | <strong>Frontend:</strong> http://localhost:3000</p>
        </div>

        <div class="stats" id="stats">
            <h2>📊 Mekan İstatistikleri</h2>
            <div class="stats-grid">
                <div class="stat">
                    <p class="stat-number" id="total-venues">-</p>
                    <p class="stat-label">Toplam Mekan</p>
                </div>
                <div class="stat">
                    <p class="stat-number" id="working-websites">-</p>
                    <p class="stat-label">Çalışan Website</p>
                </div>
                <div class="stat">
                    <p class="stat-number" id="success-rate">-</p>
                    <p class="stat-label">Başarı Oranı</p>
                </div>
                <div class="stat">
                    <p class="stat-number" id="avg-busyness">-</p>
                    <p class="stat-label">Ort. Yoğunluk</p>
                </div>
            </div>
        </div>

        <div id="venues-container">
            <div class="loading">
                🔄 Mekanlar yükleniyor...
            </div>
        </div>
    </div>

    <script>
        const BACKEND_URL = 'http://localhost:8002';
        let venues = [];
        let websiteStats = {
            total: 0,
            working: 0,
            tested: 0
        };

        async function loadVenues() {
            try {
                const response = await fetch(`${BACKEND_URL}/api/venues`);
                const data = await response.json();
                venues = data.data || [];
                
                updateStats();
                renderVenues();
                testAllWebsites();
                
            } catch (error) {
                document.getElementById('venues-container').innerHTML = `
                    <div class="error">
                        <h3>❌ Hata!</h3>
                        <p>Mekan verileri yüklenemedi: ${error.message}</p>
                        <button class="btn btn-primary" onclick="loadVenues()">Tekrar Dene</button>
                    </div>
                `;
            }
        }

        function updateStats() {
            document.getElementById('total-venues').textContent = venues.length;
            
            const avgBusyness = venues.length > 0 
                ? Math.round(venues.reduce((sum, v) => sum + v.current_busyness, 0) / venues.length)
                : 0;
            document.getElementById('avg-busyness').textContent = avgBusyness + '%';
            
            websiteStats.total = venues.filter(v => v.website).length;
            updateWebsiteStats();
        }

        function updateWebsiteStats() {
            document.getElementById('working-websites').textContent = `${websiteStats.working}/${websiteStats.total}`;
            const rate = websiteStats.total > 0 
                ? Math.round((websiteStats.working / websiteStats.total) * 100)
                : 0;
            document.getElementById('success-rate').textContent = rate + '%';
        }

        function renderVenues() {
            const container = document.getElementById('venues-container');
            
            if (venues.length === 0) {
                container.innerHTML = '<div class="error"><h3>⚠️ Mekan bulunamadı</h3></div>';
                return;
            }

            container.innerHTML = `
                <div class="venues-grid">
                    ${venues.map(venue => `
                        <div class="venue-card">
                            <div class="venue-header">
                                <h3 class="venue-name">${venue.name}</h3>
                                <span class="busyness-badge ${getBusynessClass(venue.busyness_label)}">
                                    ${venue.current_busyness}% ${venue.busyness_label}
                                </span>
                            </div>
                            
                            <div class="venue-info">
                                <p>📍 ${venue.address}</p>
                                <p>🏷️ ${venue.type.replace('_', ' ')}</p>
                                <p>⭐ ${venue.rating}/5 | 💰 ${getPriceLevel(venue.price_level)}</p>
                                <p>📞 ${venue.phone}</p>
                                ${venue.website ? `
                                    <p>🌐 <a href="${venue.website}" target="_blank" style="color: #60a5fa;">${venue.website}</a>
                                        <span class="website-status" id="status-${venue.id}">
                                            <span class="status-dot status-unknown"></span>
                                            Test ediliyor...
                                        </span>
                                    </p>
                                ` : '<p>🌐 Website bilgisi yok</p>'}
                            </div>
                            
                            <div class="venue-actions">
                                <button class="btn btn-primary" onclick="openVenueDetails('${venue.id}')">
                                    📋 Detaylar
                                </button>
                                ${venue.website ? `
                                    <a href="${venue.website}" target="_blank" class="btn btn-success">
                                        🌐 Website'yi Aç
                                    </a>
                                    <button class="btn btn-secondary" onclick="testWebsite('${venue.id}', '${venue.website}')">
                                        🔄 Website Test
                                    </button>
                                ` : ''}
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function getBusynessClass(label) {
            const classes = {
                'Not Busy': 'not-busy',
                'Moderate': 'moderate', 
                'Busy': 'busy',
                'Very Busy': 'very-busy',
                'Extremely Busy': 'extremely-busy'
            };
            return classes[label] || 'moderate';
        }

        function getPriceLevel(level) {
            const levels = ['Free', '$', '$', '$$', '$$'];
            return levels[level] || '—';
        }

        async function testWebsite(venueId, website) {
            const statusElement = document.getElementById(`status-${venueId}`);
            
            statusElement.innerHTML = `
                <span class="status-dot status-unknown"></span>
                Test ediliyor...
            `;
            
            try {
                // CORS nedeniyle direkt test edemeyiz, backend üzerinden test edelim
                const response = await fetch(website, { 
                    mode: 'no-cors',
                    method: 'HEAD'
                });
                
                // no-cors mode'da response status'u alamayız, bu yüzden başarılı kabul edelim
                statusElement.innerHTML = `
                    <span class="status-dot status-working"></span>
                    Çalışıyor
                `;
                websiteStats.working++;
                
            } catch (error) {
                statusElement.innerHTML = `
                    <span class="status-dot status-error"></span>
                    Hata
                `;
            }
            
            websiteStats.tested++;
            updateWebsiteStats();
        }

        async function testAllWebsites() {
            for (const venue of venues) {
                if (venue.website) {
                    await testWebsite(venue.id, venue.website);
                    // Kısa bir bekleme ekleyelim
                    await new Promise(resolve => setTimeout(resolve, 500));
                }
            }
        }

        async function openVenueDetails(venueId) {
            try {
                const response = await fetch(`${BACKEND_URL}/api/venues/${venueId}`);
                const venue = await response.json();
                
                const details = `
🏢 ${venue.name}
📍 ${venue.address}
🏷️ ${venue.type}
⭐ Rating: ${venue.rating}/5
💰 Price Level: ${getPriceLevel(venue.price_level)}
📞 Phone: ${venue.phone}
🌐 Website: ${venue.website || 'N/A'}
📊 Current Busyness: ${venue.current_busyness}% (${venue.busyness_label})
📅 Created: ${new Date(venue.created_at).toLocaleDateString('tr-TR')}
                `;
                
                alert(details);
                
            } catch (error) {
                alert(`Venue detayları alınamadı: ${error.message}`);
            }
        }

        // Sayfa yüklendiğinde mekanları yükle
        window.addEventListener('load', loadVenues);
    </script>
</body>
</html>
