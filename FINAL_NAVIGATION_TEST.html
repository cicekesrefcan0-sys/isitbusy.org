<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final Navigation Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0a0a0f;
            color: white;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .test-section {
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .success { border-left: 4px solid #22c55e; }
        .error { border-left: 4px solid #ef4444; }
        .warning { border-left: 4px solid #f59e0b; }
        .venue-card {
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            padding: 16px;
            margin: 10px 0;
            cursor: pointer;
            transition: all 0.3s;
        }
        .venue-card:hover {
            background: rgba(255,255,255,0.1);
            transform: translateY(-2px);
        }
        .venue-image {
            width: 80px;
            height: 80px;
            border-radius: 8px;
            object-fit: cover;
            float: left;
            margin-right: 16px;
        }
        .venue-info {
            overflow: hidden;
        }
        .venue-name {
            font-size: 18px;
            font-weight: bold;
            color: #60a5fa;
            margin-bottom: 8px;
        }
        .venue-address {
            color: #9ca3af;
            margin-bottom: 8px;
        }
        .venue-meta {
            font-size: 12px;
            color: #6b7280;
        }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px 5px;
        }
        button:hover { background: #2563eb; }
        .big-number {
            font-size: 48px;
            font-weight: bold;
            color: #60a5fa;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 Final Navigation Test</h1>
        <p>Bu sayfa tüm sorunların çözülüp çözülmediğini test eder.</p>
        
        <button onclick="runAllTests()">🚀 Tüm Testleri Çalıştır</button>
        <button onclick="testNavigation()">🧭 Navigation Test</button>
        <button onclick="loadVenues()">📍 Venue Listesi</button>
        
        <div id="results"></div>
        <div id="venues"></div>
    </div>

    <script>
        let allVenues = [];

        async function runAllTests() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<h2>🧪 Test Sonuçları</h2>';
            
            // Backend test
            await testBackend();
            
            // Frontend test
            await testFrontend();
            
            // Navigation test
            await testNavigation();
            
            // Venue loading test
            await loadVenues();
        }

        async function testBackend() {
            const resultsDiv = document.getElementById('results');
            
            try {
                // Test venue list
                const listResponse = await fetch('http://localhost:8001/api/venues?limit=5');
                const listData = await listResponse.json();
                const venues = listData.data || [];
                
                if (venues.length > 0) {
                    resultsDiv.innerHTML += `
                        <div class="test-section success">
                            <h3>✅ Backend Venue List</h3>
                            <div class="big-number">${venues.length}</div>
                            <p>Venue bulundu</p>
                        </div>
                    `;
                    
                    // Test venue detail
                    const firstVenue = venues[0];
                    const detailResponse = await fetch(`http://localhost:8001/api/venues/${firstVenue.id}`);
                    
                    if (detailResponse.ok) {
                        const detailData = await detailResponse.json();
                        resultsDiv.innerHTML += `
                            <div class="test-section success">
                                <h3>✅ Backend Venue Detail</h3>
                                <p>Venue detail endpoint çalışıyor</p>
                                <p>Test venue: ${detailData.name}</p>
                            </div>
                        `;
                    } else {
                        resultsDiv.innerHTML += `
                            <div class="test-section error">
                                <h3>❌ Backend Venue Detail</h3>
                                <p>Detail endpoint hatası: ${detailResponse.status}</p>
                            </div>
                        `;
                    }
                } else {
                    resultsDiv.innerHTML += `
                        <div class="test-section error">
                            <h3>❌ Backend Venue List</h3>
                            <p>Hiç venue bulunamadı</p>
                        </div>
                    `;
                }
            } catch (error) {
                resultsDiv.innerHTML += `
                    <div class="test-section error">
                        <h3>❌ Backend Bağlantı Hatası</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

        async function testFrontend() {
            const resultsDiv = document.getElementById('results');
            
            const ports = [3000, 3001];
            let workingPort = null;
            
            for (const port of ports) {
                try {
                    const response = await fetch(`http://localhost:${port}`);
                    if (response.ok) {
                        workingPort = port;
                        break;
                    }
                } catch (e) {
                    // Port çalışmıyor
                }
            }
            
            if (workingPort) {
                resultsDiv.innerHTML += `
                    <div class="test-section success">
                        <h3>✅ Frontend Çalışıyor</h3>
                        <p>Port: ${workingPort}</p>
                        <p><a href="http://localhost:${workingPort}" target="_blank" style="color: #60a5fa;">Ana Sayfayı Aç</a></p>
                    </div>
                `;
            } else {
                resultsDiv.innerHTML += `
                    <div class="test-section error">
                        <h3>❌ Frontend Çalışmıyor</h3>
                        <p>npm start yapılmış mı?</p>
                    </div>
                `;
            }
        }

        async function testNavigation() {
            const resultsDiv = document.getElementById('results');
            
            try {
                const response = await fetch('http://localhost:8001/api/venues?limit=3');
                const data = await response.json();
                const venues = data.data || [];
                
                if (venues.length > 0) {
                    const testVenue = venues[0];
                    const detailResponse = await fetch(`http://localhost:8001/api/venues/${testVenue.id}`);
                    
                    if (detailResponse.ok) {
                        resultsDiv.innerHTML += `
                            <div class="test-section success">
                                <h3>✅ Navigation Çalışıyor</h3>
                                <p>Venue'lara tıklayınca doğru sayfaya gidecek</p>
                                <p>Test URL: /venue/${testVenue.id}</p>
                            </div>
                        `;
                    } else {
                        resultsDiv.innerHTML += `
                            <div class="test-section error">
                                <h3>❌ Navigation Sorunu</h3>
                                <p>Venue detail endpoint çalışmıyor</p>
                            </div>
                        `;
                    }
                }
            } catch (error) {
                resultsDiv.innerHTML += `
                    <div class="test-section error">
                        <h3>❌ Navigation Test Hatası</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

        async function loadVenues() {
            const venuesDiv = document.getElementById('venues');
            venuesDiv.innerHTML = '<h2>📍 Venue Listesi</h2><p>Yükleniyor...</p>';
            
            try {
                const response = await fetch('http://localhost:8001/api/venues?limit=10');
                const data = await response.json();
                allVenues = data.data || [];
                
                if (allVenues.length > 0) {
                    venuesDiv.innerHTML = `
                        <h2>📍 Venue Listesi (${allVenues.length} venue)</h2>
                        <p>Bu venue'lara tıklayarak navigation'ı test edebilirsin:</p>
                    `;
                    
                    allVenues.forEach(venue => {
                        venuesDiv.innerHTML += `
                            <div class="venue-card" onclick="testVenueNavigation('${venue.id}', '${venue.name}')">
                                <img 
                                    class="venue-image" 
                                    src="${venue.image_url || 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iODAiIGhlaWdodD0iODAiIHZpZXdCb3g9IjAgMCA4MCA4MCIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KPHJlY3Qgd2lkdGg9IjgwIiBoZWlnaHQ9IjgwIiBmaWxsPSIjMzc0MTUxIi8+Cjx0ZXh0IHg9IjQwIiB5PSI0NSIgZm9udC1mYW1pbHk9IkFyaWFsIiBmb250LXNpemU9IjEwIiBmaWxsPSIjOWNhM2FmIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIj5SZXNpbSBZb2s8L3RleHQ+Cjwvc3ZnPgo='}"
                                    alt="${venue.name}"
                                    onerror="this.src='data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iODAiIGhlaWdodD0iODAiIHZpZXdCb3g9IjAgMCA4MCA4MCIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KPHJlY3Qgd2lkdGg9IjgwIiBoZWlnaHQ9IjgwIiBmaWxsPSIjMzc0MTUxIi8+Cjx0ZXh0IHg9IjQwIiB5PSI0NSIgZm9udC1mYW1pbHk9IkFyaWFsIiBmb250LXNpemU9IjEwIiBmaWxsPSIjOWNhM2FmIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIj5SZXNpbSBZb2s8L3RleHQ+Cjwvc3ZnPgo='"
                                >
                                <div class="venue-info">
                                    <div class="venue-name">${venue.name}</div>
                                    <div class="venue-address">📍 ${venue.address}</div>
                                    <div class="venue-meta">
                                        🏷️ ${venue.type} | 
                                        ⭐ ${venue.rating || 'N/A'} | 
                                        🔗 ${venue.data_source} |
                                        🖼️ ${venue.image_url ? 'Resim var' : 'Resim yok'}
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    venuesDiv.innerHTML = '<h2>❌ Hiç venue bulunamadı</h2>';
                }
            } catch (error) {
                venuesDiv.innerHTML = `<h2>❌ Venue yükleme hatası</h2><p>${error.message}</p>`;
            }
        }

        async function testVenueNavigation(venueId, venueName) {
            try {
                const response = await fetch(`http://localhost:8001/api/venues/${venueId}`);
                if (response.ok) {
                    const data = await response.json();
                    alert(`✅ Navigation başarılı!\n\nVenue: ${data.name}\nID: ${data.id}\nAdres: ${data.address}\n\nFrontend'te bu venue'ya gidebilirsin: /venue/${venueId}`);
                    
                    // Frontend'i aç
                    window.open(`http://localhost:3000/venue/${venueId}`, '_blank');
                } else {
                    alert(`❌ Navigation hatası!\nVenue ID: ${venueId}\nHTTP Status: ${response.status}`);
                }
            } catch (error) {
                alert(`❌ Bağlantı hatası!\n${error.message}`);
            }
        }

        // Sayfa yüklendiğinde otomatik test
        window.addEventListener('load', () => {
            runAllTests();
        });
    </script>
</body>
</html>
